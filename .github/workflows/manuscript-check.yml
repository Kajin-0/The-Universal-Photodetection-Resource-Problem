name: Manuscript LaTeX check

on:
  push:
    branches:
      - agent/uprp-core-theorem-round10
    paths:
      - 'manuscript/**'
      - '.github/workflows/manuscript-check.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Rev4 from verified Rev3
        run: python manuscript/apply_rev4.py
      - name: Compile manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: event_resource_theorem_rev4.tex
          working_directory: manuscript
          latexmk_use_xelatex: false
      - name: Upload manuscript artifacts
        uses: actions/upload-artifact@v4
        with:
          name: event-resource-theorem-rev4
          path: |
            manuscript/event_resource_theorem_rev4.pdf
            manuscript/event_resource_theorem_rev4.tex
      - name: Report one-shot Rev4 verification success
        if: ${{ contains(github.event.head_commit.message, 'Rev4 verification') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 12 --repo "$GITHUB_REPOSITORY" --body "Rev4 manuscript verification succeeded for commit \`$GITHUB_SHA\`: deterministic Rev4 generation, LaTeX compilation, and artifact upload all completed successfully."
