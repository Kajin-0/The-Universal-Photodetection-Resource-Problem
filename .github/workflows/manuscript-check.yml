name: Manuscript LaTeX check

on:
  push:
    branches:
      - agent/uprp-core-theorem-round10
    paths:
      - 'manuscript/**'
      - '.github/workflows/manuscript-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Rev4 from verified Rev3
        run: python manuscript/apply_rev4.py
      - name: Compile manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: event_resource_theorem_rev4.tex
          working_directory: manuscript
          latexmk_use_xelatex: false
      - name: Upload manuscript artifacts
        uses: actions/upload-artifact@v4
        with:
          name: event-resource-theorem-rev4
          path: |
            manuscript/event_resource_theorem_rev4.pdf
            manuscript/event_resource_theorem_rev4.tex
      - name: Persist verified Rev4 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- manuscript/event_resource_theorem_rev4.tex
          git commit -m "Persist verified Rev4 manuscript [skip ci]"
          git push
