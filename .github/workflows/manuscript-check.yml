name: Manuscript LaTeX check

on:
  push:
    branches:
      - agent/uprp-core-theorem-round10
    paths:
      - 'manuscript/**'
      - '.github/workflows/manuscript-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Rev8 from frozen Rev7
        working-directory: manuscript
        run: python apply_rev8_referee_surgical.py

      - name: Verify generated Rev8 source hashes
        working-directory: manuscript
        run: sha256sum -c REV8_SHA256SUMS.txt

      - name: Generate Rev9 grounding revision from Rev8
        working-directory: manuscript
        run: python apply_rev9_grounding.py

      - name: Verify generated Rev9 source hashes
        working-directory: manuscript
        run: sha256sum -c REV9_SHA256SUMS.txt

      - name: Generate Rev10 literature-IRF example from Rev9
        working-directory: manuscript
        run: python apply_rev10_literature_example.py

      - name: Verify Rev10 source and analysis hashes
        working-directory: manuscript
        run: sha256sum -c REV10_SHA256SUMS.txt

      - name: Reproduce Rev10 worked-example numbers
        working-directory: manuscript
        run: python analyze_spinelli1998_fig3_rev10.py

      - name: Generate Rev11 ENBW positioning from Rev10
        working-directory: manuscript
        run: python apply_rev11_enbw_positioning.py

      - name: Verify Rev11 source and positioning hashes
        working-directory: manuscript
        run: sha256sum -c REV11_SHA256SUMS.txt

      - name: Compile Rev11
        uses: xu-cheng/latex-action@v3
        with:
          root_file: event_resource_theorem_rev11.tex
          working_directory: manuscript
          latexmk_use_xelatex: false

      - name: Upload verified Rev11 artifact
        uses: actions/upload-artifact@v4
        with:
          name: event-resource-theorem-rev11
          path: |
            manuscript/event_resource_theorem_rev11.pdf
            manuscript/event_resource_theorem_rev11.tex
            manuscript/appendix_rare_fast_counterexample_rev8.tex
            manuscript/section_waveform_operator_rev7.tex
            manuscript/section_operational_bandwidth_rev7.tex
            manuscript/section_practical_grounding_rev11.tex
            manuscript/section_empirical_grounding_rev9.tex
            manuscript/section_worked_irf_example_rev10.tex
            manuscript/spinelli1998_fig3_digitized_rev10.csv
            manuscript/analyze_spinelli1998_fig3_rev10.py
            manuscript/figure_resource_hierarchy_rev7.tex
            manuscript/figure_jitter_no_go.tex
            manuscript/fig_jitter_no_go_data.csv
            manuscript/references.bib
            manuscript/REV8_SHA256SUMS.txt
            manuscript/REV9_SHA256SUMS.txt
            manuscript/REV10_SHA256SUMS.txt
            manuscript/REV11_SHA256SUMS.txt
