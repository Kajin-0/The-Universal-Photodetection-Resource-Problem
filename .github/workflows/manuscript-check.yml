name: Manuscript LaTeX check

on:
  push:
    branches:
      - agent/uprp-core-theorem-round10
    paths:
      - 'manuscript/**'
      - '.github/workflows/manuscript-check.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  persist-rev5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Rev5
        run: python manuscript/apply_rev5.py
      - name: Persist verified Rev5 source once
        run: |
          if git diff --quiet -- manuscript/event_resource_theorem_rev5.tex; then
            echo "Rev5 source already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- manuscript/event_resource_theorem_rev5.tex
          git commit -m "Persist verified Rev5 manuscript source"
          git push
      - name: One-shot persistence report
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const conclusion = '${{ job.status }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 12,
              body: `Rev5 source persistence ${conclusion} for trigger commit \`${context.sha}\`, Actions run \`${context.runId}\`.`
            });
