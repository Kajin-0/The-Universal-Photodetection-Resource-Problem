name: Manuscript LaTeX check

on:
  push:
    branches:
      - agent/uprp-core-theorem-round10
    paths:
      - 'manuscript/**'
      - '.github/workflows/manuscript-check.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Rev5
        run: python manuscript/apply_rev5.py
      - name: Compile manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: event_resource_theorem_rev5.tex
          working_directory: manuscript
          latexmk_use_xelatex: false
      - name: Upload manuscript artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: event-resource-theorem-rev5
          path: |
            manuscript/event_resource_theorem_rev5.pdf
            manuscript/event_resource_theorem_rev5.tex
      - name: One-shot verification report
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const conclusion = '${{ job.status }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 12,
              body: `Rev5 artifact capture ${conclusion} for commit \`${context.sha}\`, Actions run \`${context.runId}\`: generation, LaTeX compilation, and artifact upload were targeted.`
            });
