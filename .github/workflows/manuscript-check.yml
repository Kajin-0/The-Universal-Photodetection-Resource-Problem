name: Manuscript LaTeX check

on:
  push:
    branches:
      - agent/uprp-core-theorem-round10
    paths:
      - 'manuscript/**'
      - '.github/workflows/manuscript-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: event_resource_theorem_rev6.tex
          working_directory: manuscript
          latexmk_use_xelatex: false
      - name: Upload manuscript artifacts
        uses: actions/upload-artifact@v4
        with:
          name: event-resource-theorem-rev6
          path: |
            manuscript/event_resource_theorem_rev6.pdf
            manuscript/event_resource_theorem_rev6.tex
            manuscript/appendix_rare_fast_counterexample_rev6.tex
