name: Autonomous temporal manuscript LaTeX check

on:
  push:
    branches:
      - agent/autonomous-temporal-information-law
    paths:
      - 'manuscript/autonomous_temporal_information/**'
      - '.github/workflows/autonomous-temporal-manuscript-check.yml'
  pull_request:
    branches:
      - agent/autonomous-temporal-information-law
    paths:
      - 'manuscript/autonomous_temporal_information/**'
      - '.github/workflows/autonomous-temporal-manuscript-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate audited M2R2 referee-repair sources
        working-directory: manuscript/autonomous_temporal_information
        run: python apply_m2r2_review_repairs.py

      - name: Apply final R2 submission cleanup
        working-directory: manuscript/autonomous_temporal_information
        run: python apply_submission_cleanup_r2.py

      - name: Generate M2R3 boundary-QFI strengthening
        working-directory: manuscript/autonomous_temporal_information
        run: python apply_m2r3_boundary_strengthening.py

      - name: Generate PRX Quantum R3 front matter and figure
        working-directory: manuscript/autonomous_temporal_information
        run: python apply_prxq_frontmatter_r3.py

      - name: Static TeX integrity, standalone-identity, and R3 theorem gate
        working-directory: manuscript/autonomous_temporal_information
        run: python check_m2_tex_static.py

      - name: Compile PRX Quantum R3 main manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: autonomous_temporal_resource_law_prxq_r3.tex
          working_directory: manuscript/autonomous_temporal_information
          latexmk_use_xelatex: false

      - name: Compile canonical M2R3 supplement
        uses: xu-cheng/latex-action@v3
        with:
          root_file: autonomous_temporal_resource_law_supplement_m2r3.tex
          working_directory: manuscript/autonomous_temporal_information
          latexmk_use_xelatex: false

      - name: Upload standalone submission build
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-temporal-information-prxq-r3-standalone
          path: |
            manuscript/autonomous_temporal_information/autonomous_temporal_resource_law_prxq_r3.pdf
            manuscript/autonomous_temporal_information/autonomous_temporal_resource_law_prxq_r3.tex
            manuscript/autonomous_temporal_information/autonomous_temporal_resource_law_supplement_m2r3.pdf
            manuscript/autonomous_temporal_information/autonomous_temporal_resource_law_supplement_m2r3.tex
            manuscript/autonomous_temporal_information/sections/*.tex
            manuscript/autonomous_temporal_information/proofs/*.tex
            manuscript/autonomous_temporal_information/references.bib
            manuscript/autonomous_temporal_information/PRXQ_POPULAR_SUMMARY_R1.md
