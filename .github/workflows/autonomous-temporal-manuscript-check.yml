name: Autonomous temporal manuscript LaTeX check

on:
  push:
    branches:
      - agent/autonomous-temporal-information-law
    paths:
      - 'manuscript/autonomous_temporal_information/**'
      - '.github/workflows/autonomous-temporal-manuscript-check.yml'
  pull_request:
    branches:
      - agent/autonomous-temporal-information-law
    paths:
      - 'manuscript/autonomous_temporal_information/**'
      - '.github/workflows/autonomous-temporal-manuscript-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate audited M2R2 referee-repair sources
        working-directory: manuscript/autonomous_temporal_information
        run: python apply_m2r2_review_repairs.py

      - name: Apply final R2 submission cleanup
        working-directory: manuscript/autonomous_temporal_information
        run: python apply_submission_cleanup_r2.py

      - name: Generate PRX Quantum R2 front matter and figure
        working-directory: manuscript/autonomous_temporal_information
        run: python apply_prxq_frontmatter_r2.py

      - name: Static TeX integrity gate
        working-directory: manuscript/autonomous_temporal_information
        run: python check_m2_tex_static.py

      - name: Compile PRX Quantum R2 main manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: autonomous_temporal_resource_law_prxq_r2.tex
          working_directory: manuscript/autonomous_temporal_information
          latexmk_use_xelatex: false

      - name: Compile canonical M2R2 supplement
        uses: xu-cheng/latex-action@v3
        with:
          root_file: autonomous_temporal_resource_law_supplement_m2r2.tex
          working_directory: manuscript/autonomous_temporal_information
          latexmk_use_xelatex: false

      - name: Upload manuscript builds
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-temporal-information-prxq-r2-final
          path: |
            manuscript/autonomous_temporal_information/autonomous_temporal_resource_law_prxq_r2.pdf
            manuscript/autonomous_temporal_information/autonomous_temporal_resource_law_prxq_r2.tex
            manuscript/autonomous_temporal_information/autonomous_temporal_resource_law_m2r2.tex
            manuscript/autonomous_temporal_information/autonomous_temporal_resource_law_supplement_m2r2.pdf
            manuscript/autonomous_temporal_information/autonomous_temporal_resource_law_supplement_m2r2.tex
            manuscript/autonomous_temporal_information/sections/*.tex
            manuscript/autonomous_temporal_information/proofs/*.tex
            manuscript/autonomous_temporal_information/apply_m2r2_review_repairs.py
            manuscript/autonomous_temporal_information/apply_submission_cleanup_r2.py
            manuscript/autonomous_temporal_information/apply_prxq_frontmatter_r2.py
            manuscript/autonomous_temporal_information/check_m2_tex_static.py
            manuscript/autonomous_temporal_information/references.bib
            manuscript/autonomous_temporal_information/PRXQ_POPULAR_SUMMARY_R1.md
            manuscript/autonomous_temporal_information/THEOREM_PROVENANCE_MATRIX.md
            manuscript/autonomous_temporal_information/MANUSCRIPT_HANDOFF.md
