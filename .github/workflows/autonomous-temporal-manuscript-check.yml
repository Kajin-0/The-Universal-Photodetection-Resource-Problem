name: Autonomous temporal manuscript LaTeX check

on:
  push:
    branches:
      - agent/autonomous-temporal-information-law
    paths:
      - 'manuscript/autonomous_temporal_information/**'
      - '.github/workflows/autonomous-temporal-manuscript-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static M2 TeX integrity gate
        working-directory: manuscript/autonomous_temporal_information
        run: python check_m2_tex_static.py

      - name: Compile canonical M2 main manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: autonomous_temporal_resource_law_m2.tex
          working_directory: manuscript/autonomous_temporal_information
          latexmk_use_xelatex: false

      - name: Compile canonical M2 supplement
        uses: xu-cheng/latex-action@v3
        with:
          root_file: autonomous_temporal_resource_law_supplement_m2.tex
          working_directory: manuscript/autonomous_temporal_information
          latexmk_use_xelatex: false

      - name: Upload manuscript builds
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-temporal-information-manuscript-m2
          path: |
            manuscript/autonomous_temporal_information/autonomous_temporal_resource_law_m2.pdf
            manuscript/autonomous_temporal_information/autonomous_temporal_resource_law_m2.tex
            manuscript/autonomous_temporal_information/autonomous_temporal_resource_law_supplement_m2.pdf
            manuscript/autonomous_temporal_information/autonomous_temporal_resource_law_supplement_m2.tex
            manuscript/autonomous_temporal_information/proofs/*.tex
            manuscript/autonomous_temporal_information/check_m2_tex_static.py
            manuscript/autonomous_temporal_information/references.bib
            manuscript/autonomous_temporal_information/THEOREM_PROVENANCE_MATRIX.md
            manuscript/autonomous_temporal_information/MANUSCRIPT_HANDOFF.md
