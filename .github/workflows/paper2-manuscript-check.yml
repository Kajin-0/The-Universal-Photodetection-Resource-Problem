name: Paper 2 LaTeX check

on:
  push:
    branches:
      - agent/uprp-core-theorem-round10
    paths:
      - 'paper2/manuscript/**'
      - '.github/workflows/paper2-manuscript-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-paper2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Paper 2 Rev1
        uses: xu-cheng/latex-action@v3
        with:
          root_file: fisher_spectra_memory_photodetectors_rev1.tex
          working_directory: paper2/manuscript
          latexmk_use_xelatex: false

      - name: Check for unresolved references or citations
        working-directory: paper2/manuscript
        run: |
          if grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references" fisher_spectra_memory_photodetectors_rev1.log; then
            echo "Unresolved LaTeX references/citations detected"
            exit 1
          fi

      - name: Upload Paper 2 Rev1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: fisher-spectra-memory-photodetectors-rev1
          path: |
            paper2/manuscript/fisher_spectra_memory_photodetectors_rev1.pdf
            paper2/manuscript/fisher_spectra_memory_photodetectors_rev1.tex
            paper2/manuscript/paper2_refs.bib
