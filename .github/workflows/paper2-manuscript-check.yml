name: Paper 2 LaTeX check

on:
  push:
    branches:
      - agent/uprp-core-theorem-round10
    paths:
      - 'paper2/manuscript/**'
      - '.github/workflows/paper2-manuscript-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-paper2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Paper 2 Rev2 from Rev1
        working-directory: paper2/manuscript
        run: python apply_rev2_science_fix.py

      - name: Generate Paper 2 Rev3 from Rev2
        working-directory: paper2/manuscript
        run: python apply_rev3_mechanical_polish.py

      - name: Compile Paper 2 Rev3
        uses: xu-cheng/latex-action@v3
        with:
          root_file: fisher_spectra_memory_photodetectors_rev3.tex
          working_directory: paper2/manuscript
          latexmk_use_xelatex: false

      - name: Check for unresolved references, citations, or box overflow
        working-directory: paper2/manuscript
        run: |
          if grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|Package natbib Warning:.*undefined" fisher_spectra_memory_photodetectors_rev3.log; then
            echo "Unresolved LaTeX references/citations detected"
            exit 1
          fi
          if grep -E "Overfull \\hbox|Overfull \\vbox" fisher_spectra_memory_photodetectors_rev3.log; then
            echo "Overfull LaTeX boxes detected"
            exit 1
          fi

      - name: Upload Paper 2 Rev3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: fisher-spectra-memory-photodetectors-rev3
          path: |
            paper2/manuscript/fisher_spectra_memory_photodetectors_rev3.pdf
            paper2/manuscript/fisher_spectra_memory_photodetectors_rev3.tex
            paper2/manuscript/fisher_spectra_memory_photodetectors_rev2.tex
            paper2/manuscript/fisher_spectra_memory_photodetectors_rev1.tex
            paper2/manuscript/apply_rev2_science_fix.py
            paper2/manuscript/apply_rev3_mechanical_polish.py
            paper2/manuscript/paper2_refs.bib
