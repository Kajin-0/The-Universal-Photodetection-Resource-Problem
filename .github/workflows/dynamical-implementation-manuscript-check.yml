name: Dynamical implementation manuscript LaTeX check

on:
  push:
    branches:
      - agent/autonomous-temporal-information-law
    paths:
      - 'manuscript/dynamical_implementation_cost/**'
      - '.github/workflows/dynamical-implementation-manuscript-check.yml'
  pull_request:
    branches:
      - agent/autonomous-temporal-information-law
    paths:
      - 'manuscript/dynamical_implementation_cost/**'
      - '.github/workflows/dynamical-implementation-manuscript-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate audited D2 sources
        working-directory: manuscript/dynamical_implementation_cost
        run: python apply_d2_audit_repairs.py

      - name: Static D2 theorem and identity gate
        working-directory: manuscript/dynamical_implementation_cost
        run: python check_tex_static_d2.py

      - name: Generate PRA R1 publication-facing main
        working-directory: manuscript/dynamical_implementation_cost
        run: python apply_pra_r1_frontmatter.py

      - name: PRA R1 standalone and theorem-freeze gate
        working-directory: manuscript/dynamical_implementation_cost
        run: python check_pra_r1_static.py

      - name: Compile PRA R1 main manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: dynamical_rank_boundary_implementation_cost_pra_r1.tex
          working_directory: manuscript/dynamical_implementation_cost
          latexmk_use_xelatex: false

      - name: Compile audited D2 supplemental material
        uses: xu-cheng/latex-action@v3
        with:
          root_file: dynamical_rank_boundary_implementation_cost_supplement_d2.tex
          working_directory: manuscript/dynamical_implementation_cost
          latexmk_use_xelatex: false

      - name: Final PRA R1 LaTeX quality gate
        working-directory: manuscript/dynamical_implementation_cost
        run: python check_pra_build_logs.py

      - name: Upload standalone PRA R1 manuscript build
        uses: actions/upload-artifact@v4
        with:
          name: dynamical-rank-boundary-implementation-cost-pra-r1
          path: |
            manuscript/dynamical_implementation_cost/dynamical_rank_boundary_implementation_cost_pra_r1.pdf
            manuscript/dynamical_implementation_cost/dynamical_rank_boundary_implementation_cost_pra_r1.tex
            manuscript/dynamical_implementation_cost/dynamical_rank_boundary_implementation_cost_supplement_d2.pdf
            manuscript/dynamical_implementation_cost/dynamical_rank_boundary_implementation_cost_supplement_d2.tex
            manuscript/dynamical_implementation_cost/references.bib
