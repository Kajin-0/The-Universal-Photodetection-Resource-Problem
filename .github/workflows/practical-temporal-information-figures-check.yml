name: Practical temporal-information figure package check

on:
  push:
    branches:
      - agent/practical-temporal-information-benchmarks
    paths:
      - 'manuscript/practical_temporal_information/figures/**'
      - '.github/workflows/practical-temporal-information-figures-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned figure dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.2 matplotlib==3.10.5

      - name: Generate all four deterministic figures
        working-directory: manuscript/practical_temporal_information/figures
        run: python generate_all.py

      - name: Verify publication outputs
        working-directory: manuscript/practical_temporal_information/figures
        run: |
          python - <<'PY'
          from pathlib import Path
          out = Path("generated")
          stems = [
              "fig1_same_specs_different_information",
              "fig2_same_saturation_different_timestamps",
              "fig3_support_survival_synthesis_crossover",
              "fig4_resonant_implementation_falsification",
          ]
          for stem in stems:
              pdf = out / f"{stem}.pdf"
              png = out / f"{stem}.png"
              assert pdf.exists() and pdf.stat().st_size > 10000, pdf
              assert png.exists() and png.stat().st_size > 20000, png
              assert pdf.read_bytes().startswith(b"%PDF"), pdf
              assert png.read_bytes().startswith(b"\x89PNG\r\n\x1a\n"), png
          assert (out / "locked_values.json").exists()
          assert (out / "manifest.json").exists()
          print("Figure output gate: PASS")
          PY

      - name: Write canonical artifact SHA-256 list
        working-directory: manuscript/practical_temporal_information/figures
        run: |
          cd generated
          sha256sum *.pdf *.png *_locked.json locked_values.json manifest.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload standalone WP12 figure package
        uses: actions/upload-artifact@v4
        with:
          name: practical-temporal-information-wp12-figures
          path: manuscript/practical_temporal_information/figures/generated/
