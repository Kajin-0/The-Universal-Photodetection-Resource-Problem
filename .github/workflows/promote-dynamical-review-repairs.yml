name: Promote dynamical reviewer repairs

on:
  push:
    branches:
      - agent/autonomous-temporal-information-law
    paths:
      - '.github/workflows/promote-dynamical-review-repairs.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/autonomous-temporal-information-law

      - name: Regenerate audited D2 and PRA R1 sources
        working-directory: manuscript/dynamical_implementation_cost
        run: |
          python apply_d2_audit_repairs.py
          python check_tex_static_d2.py
          python apply_pra_r1_frontmatter.py
          python apply_pra_r1_supplement_title.py
          python check_pra_r1_static.py

      - name: Commit exact generated sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            manuscript/dynamical_implementation_cost/dynamical_rank_boundary_implementation_cost_d2.tex \
            manuscript/dynamical_implementation_cost/dynamical_rank_boundary_implementation_cost_supplement_d2.tex \
            manuscript/dynamical_implementation_cost/dynamical_rank_boundary_implementation_cost_pra_r1.tex \
            manuscript/dynamical_implementation_cost/dynamical_rank_boundary_implementation_cost_supplement_pra_r1.tex
          if git diff --cached --quiet; then
            echo 'Generated sources already current.'
          else
            git commit -m 'Promote final hostile-review manuscript repairs'
            git push origin HEAD:agent/autonomous-temporal-information-law
          fi
