name: Grand Challenge LaTeX check

on:
  push:
    branches:
      - agent/temporal-information-resource-law
    paths:
      - 'grand_challenge/manuscript/**'
      - 'grand_challenge/numerics/**'
      - '.github/workflows/grand-challenge-manuscript-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-grand-challenge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical validation dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Generate Grand Challenge Rev2 mechanical repair
        working-directory: grand_challenge/manuscript
        run: python apply_rev2_mechanical.py

      - name: Generate Grand Challenge Rev3 hostile-review repair
        working-directory: grand_challenge/manuscript
        run: python apply_rev3_hostile_review.py

      - name: Generate Grand Challenge Rev4 final polish
        working-directory: grand_challenge/manuscript
        run: python apply_rev4_final_polish.py

      - name: Generate Grand Challenge Rev5 publication figure pass
        working-directory: grand_challenge/manuscript
        run: python apply_rev5_publication_figure.py

      - name: Generate Grand Challenge Rev6 PRX Quantum packaging
        working-directory: grand_challenge/manuscript
        run: python apply_rev6_prxquantum_packaging.py

      - name: Generate Grand Challenge Rev7 referee hardening
        working-directory: grand_challenge/manuscript
        run: python apply_rev7_referee_hardening.py

      - name: Repair Rev7 two-column layout
        working-directory: grand_challenge/manuscript
        run: python apply_rev7_layout_repair.py

      - name: Generate Rev8 local-scope clarification
        working-directory: grand_challenge/manuscript
        run: python apply_rev8_local_scope_clarification.py

      - name: Generate Rev9 spectral resource theory
        working-directory: grand_challenge/manuscript
        run: python apply_rev9_spectral_resource_theory.py

      - name: Compress Rev9 abstract
        working-directory: grand_challenge/manuscript
        run: python apply_rev9_abstract_compression.py

      - name: Generate Rev10 referee closure
        working-directory: grand_challenge/manuscript
        run: python apply_rev10_referee_closure.py

      - name: Generate Rev11 anharmonic extension
        working-directory: grand_challenge/manuscript
        run: python apply_rev11_anharmonic_extension.py

      - name: Run operational-tail numerical validation
        working-directory: grand_challenge
        run: python numerics/verify_operational_tail_bound.py

      - name: Validate truncated-Gaussian photon example
        working-directory: grand_challenge
        run: python numerics/verify_truncated_gaussian_photon_example.py

      - name: Validate complete-monotone extremizers
        working-directory: grand_challenge
        run: python numerics/verify_complete_monotone_saturation.py

      - name: Validate Herglotz high-retention law
        working-directory: grand_challenge
        run: python numerics/verify_herglotz_high_retention.py

      - name: Validate sine-profile divergence sharpness
        working-directory: grand_challenge
        run: python numerics/verify_sine_profile_divergence_sharpness.py

      - name: Validate anharmonic pure-point gap extension
        working-directory: grand_challenge
        run: python numerics/verify_anharmonic_pure_point_gap_extension.py

      - name: Compile Grand Challenge Rev11 PRX Quantum package
        uses: xu-cheng/latex-action@v3
        with:
          root_file: energy_survival_temporal_fisher_rev11_prxq.tex
          working_directory: grand_challenge/manuscript
          latexmk_use_xelatex: false

      - name: Check Rev11 references, scope, and layout
        working-directory: grand_challenge/manuscript
        run: |
          LOG=energy_survival_temporal_fisher_rev11_prxq.log
          TEX=energy_survival_temporal_fisher_rev11_prxq.tex
          SPEC=rev11_spectral_theorems.tex
          ANH=rev11_anharmonic_extension.tex
          if grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|Package natbib Warning:.*undefined" "$LOG"; then
            echo "Unresolved LaTeX references/citations detected"
            exit 1
          fi
          if grep -E "Overfull \\hbox|Overfull \\vbox" "$LOG"; then
            echo "Overfull LaTeX boxes detected"
            exit 1
          fi
          if grep -F '\boxed{' "$TEX"; then
            echo "APS-incompatible boxed markup remains"
            exit 1
          fi
          if ! grep -F '\documentclass[aps,prx,' "$TEX"; then
            echo "PRX journal option missing"
            exit 1
          fi
          if ! grep -F '\title{Spectral Resource Laws for Temporal Fisher Information}' "$TEX"; then
            echo "Rev11 title missing"
            exit 1
          fi
          if ! grep -F '\input{rev11_anharmonic_extension.tex}' "$TEX"; then
            echo "Rev11 anharmonic theorem input missing"
            exit 1
          fi
          if ! grep -F '\begin{theorem}[Bohr-gap Fisher bound]' "$ANH"; then
            echo "Arbitrary pure-point Bohr-gap theorem missing"
            exit 1
          fi
          if ! grep -F 'No global equal-spacing or commensurability assumption' "$ANH"; then
            echo "Anharmonic scope statement missing"
            exit 1
          fi
          if ! grep -F 'singular-continuous components are all allowed' "$TEX"; then
            echo "Continuum measure-regularity clarification missing"
            exit 1
          fi
          if ! grep -F 'The completion cannot create score or Fisher information' "$SPEC"; then
            echo "Null-sector completion invariance missing"
            exit 1
          fi
          if grep -F '\section{Separately optimized quantum Fisher envelope}' "$TEX"; then
            echo "Retired peripheral QFI section reappeared"
            exit 1
          fi
          if ! grep -F 'continuous at the origin' "$SPEC"; then
            echo "Bochner continuity-at-origin hypothesis missing"
            exit 1
          fi
          if ! grep -F '\begin{proposition}[Sharp high-retention exponent]' "$SPEC"; then
            echo "Sharp high-retention exponent witness missing"
            exit 1
          fi
          if ! grep -F 'does not by itself constitute a global finite-amplitude estimation-error or risk bound' "$TEX"; then
            echo "Local-Fisher scope clarification missing"
            exit 1
          fi

      - name: Upload Grand Challenge Rev11 PRX Quantum artifact
        uses: actions/upload-artifact@v4
        with:
          name: spectral-resource-laws-temporal-fisher-rev11-prxq
          path: |
            grand_challenge/manuscript/energy_survival_temporal_fisher_rev11_prxq.pdf
            grand_challenge/manuscript/energy_survival_temporal_fisher_rev11_prxq.tex
            grand_challenge/manuscript/energy_survival_temporal_fisher_rev10_prxq.tex
            grand_challenge/manuscript/apply_rev11_anharmonic_extension.py
            grand_challenge/manuscript/rev11_anharmonic_extension.tex
            grand_challenge/manuscript/rev11_spectral_theorems.tex
            grand_challenge/manuscript/figure1_operational_architecture_body_rev11.tex
            grand_challenge/manuscript/references.bib
            grand_challenge/manuscript/references_rev11.bib
            grand_challenge/numerics/verify_operational_tail_bound.py
            grand_challenge/numerics/verify_truncated_gaussian_photon_example.py
            grand_challenge/numerics/verify_complete_monotone_saturation.py
            grand_challenge/numerics/verify_herglotz_high_retention.py
            grand_challenge/numerics/verify_sine_profile_divergence_sharpness.py
            grand_challenge/numerics/verify_anharmonic_pure_point_gap_extension.py
